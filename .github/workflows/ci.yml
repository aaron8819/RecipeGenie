name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  candidate-source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tree: ${{ steps.source.outputs.tree }}
      base: ${{ steps.source.outputs.base }}
      build: ${{ steps.source.outputs.build }}
    steps:
      - name: Checkout integrated candidate head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: web/.nvmrc
      - name: Record actual checkout and require base ancestry
        id: source
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node web/scripts/workflow/candidate-source.mjs
      - name: Preserve candidate source provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-artifacts/ci/candidate-source.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  quality-guards:
    needs: candidate-source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.candidate-source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Print Runtime Versions
        run: node --version && npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Run Verification Baseline
        run: npm run verify

  migration-smoke-and-drift:
    needs: candidate-source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.candidate-source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Print Runtime Versions
        run: node --version && npm --version

      - name: Select migration rehearsal scope
        id: rehearsal-scope
        env:
          REHEARSAL_BASE_SHA: ${{ needs.candidate-source.outputs.base }}
        run: node web/scripts/workflow/migration-rehearsal-scope.mjs

      - name: Setup Supabase CLI
        if: steps.rehearsal-scope.outputs.database != 'false'
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.1

      - name: Install Web Dependencies
        if: steps.rehearsal-scope.outputs.database != 'false'
        working-directory: web
        run: npm ci

      - name: Start Local Supabase
        if: steps.rehearsal-scope.outputs.database != 'false'
        run: supabase start

      - name: Verify Migration 014 Preflight and Acceptance Parity
        if: steps.rehearsal-scope.outputs.parity != 'false'
        working-directory: web
        run: npm run test:migration014-preflight-parity

      - name: Verify Canonical Recipe Structure Migration and Rollback
        if: steps.rehearsal-scope.outputs.canonical != 'false'
        working-directory: web
        run: npm run test:canonical-recipe-structure-migration

      - name: Reset Local Database
        if: steps.rehearsal-scope.outputs.database != 'false'
        run: supabase db reset --local

      - name: Assert Required Tables and Functions
        if: steps.rehearsal-scope.outputs.database != 'false'
        shell: bash
        run: |
          ASSERT_SQL="$(cat <<'SQL'
          DO $$
          DECLARE
            missing_tables text[];
            missing_functions text[];
          BEGIN
            SELECT array_agg(t.table_name)
            INTO missing_tables
            FROM (VALUES
              ('recipes'),
              ('weekly_plans'),
              ('shopping_list'),
              ('pantry_items'),
              ('recipe_shares'),
              ('plan_templates'),
              ('user_config')
            ) AS t(table_name)
            WHERE NOT EXISTS (
              SELECT 1
              FROM information_schema.tables it
              WHERE it.table_schema = 'public'
                AND it.table_name = t.table_name
            );

            SELECT array_agg(f.function_name)
            INTO missing_functions
            FROM (VALUES
              ('filter_recipes_by_tags'),
              ('rename_tag'),
              ('merge_tags'),
              ('delete_tag'),
              ('is_shopping_document_v2'),
              ('move_shopping_document_item_to_pantry')
            ) AS f(function_name)
            WHERE NOT EXISTS (
              SELECT 1
              FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public'
                AND p.proname = f.function_name
            );

            IF missing_tables IS NOT NULL THEN
              RAISE EXCEPTION 'Missing required tables: %', missing_tables;
            END IF;

            IF missing_functions IS NOT NULL THEN
              RAISE EXCEPTION 'Missing required functions: %', missing_functions;
            END IF;
          END $$;
          SQL
          )"

          if supabase db --help | grep -q '\<query\>'; then
            printf '%s\n' "$ASSERT_SQL" | supabase db query --local
          else
            DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n1)"
            if [ -z "$DB_CONTAINER" ]; then
              echo "Could not locate local Supabase DB container."
              exit 1
            fi
            docker exec "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "$ASSERT_SQL"
          fi

      - name: Run Database Security Contracts
        if: steps.rehearsal-scope.outputs.database != 'false'
        run: supabase test db --local supabase/tests

      - name: Verify Stage 2A UUID Reference Audits
        if: steps.rehearsal-scope.outputs.database != 'false'
        shell: bash
        run: |
          echo "authenticated planner legacy write=passed"
          echo "authenticated template legacy write=passed"
          echo "authenticated history legacy write=passed"
          echo "authenticated share legacy write and acceptance=passed"
          echo "cross-owner and unresolved active writes=rejected"
          echo "anonymous writes=rejected"
          echo "direct private helper access=denied"

          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n1)"
          if [ -z "$DB_CONTAINER" ]; then
            echo "Could not locate local Supabase DB container."
            exit 1
          fi

          STAGE2A_AUDIT="$(
            docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -At -v ON_ERROR_STOP=1 \
              < supabase/verification/stage2a_uuid_reference_audit.sql
          )"
          echo "stage2a_uuid_reference_audit=$STAGE2A_AUDIT"
          if printf '%s\n' "$STAGE2A_AUDIT" | grep -Eq '": [1-9][0-9]*'; then
            echo "Stage 2A UUID reference audit reported a nonzero mismatch."
            exit 1
          fi

          ACTIVE_REFERENCE_AUDIT="$(
            docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -At -F ',' -v ON_ERROR_STOP=1 \
              < supabase/verification/active_planner_reference_audit.sql
          )"
          echo "active_reference_audit=$ACTIVE_REFERENCE_AUDIT"
          if [ "$ACTIVE_REFERENCE_AUDIT" != "0,0,0" ]; then
            echo "Active planner reference audit reported an unresolved reference."
            exit 1
          fi

      - name: Check Deterministic Schema-Type Drift
        if: steps.rehearsal-scope.outputs.database != 'false'
        working-directory: web
        run: npm run db:types:check

      - name: Stop Local Supabase
        if: always() && steps.rehearsal-scope.outputs.database != 'false'
        run: supabase stop --no-backup

  production-build:
    needs: candidate-source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.candidate-source.outputs.sha }}
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Discover all nine smoke journeys without services or credentials
        run: npm run test:e2e:smoke:list
      - name: Build production candidate
        if: needs.candidate-source.outputs.build != 'false'
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: disposable-build-only
          SUPABASE_SERVICE_ROLE_KEY: disposable-build-only
        run: npm run build
      - name: Record proven prose-only build exception
        if: needs.candidate-source.outputs.build == 'false'
        run: echo 'Build not needed for the complete known prose-only diff; smoke discovery still passed.'

  recovery-tooling:
    needs: candidate-source
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.candidate-source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: web/.nvmrc
      - name: Select recovery tooling scope
        id: scope
        env:
          REHEARSAL_BASE_SHA: ${{ needs.candidate-source.outputs.base }}
        run: node web/scripts/workflow/migration-rehearsal-scope.mjs
      - name: Explicit unrelated recovery no-op
        if: steps.scope.outputs.tooling == 'false'
        run: Write-Output 'Complete candidate diff leaves recovery tooling inputs unchanged.'
      - name: Prepare existing historical recovery fixtures
        if: steps.scope.outputs.tooling != 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Ephemeral runner required' }
          if (git status --porcelain) { throw 'Clean source required' }
          $evidenceCommit = '172958fe5a413f4c8ced08b431b3ead82dc92bf7'
          git fetch --no-tags --no-write-fetch-head origin $evidenceCommit
          if ($LASTEXITCODE -ne 0) { throw 'Pinned tooling evidence acquisition failed' }
          $resolved = git rev-parse --verify "$evidenceCommit^{commit}"
          if ($LASTEXITCODE -ne 0 -or $resolved -ne $evidenceCommit) { throw 'Pinned evidence mismatch' }
          git worktree add --detach (Join-Path $env:RUNNER_TEMP 'recovery-tooling-peer') HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Recovery peer fixture creation failed' }
      - name: Run only existing recovery tooling tests
        if: steps.scope.outputs.tooling != 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          $gitDirectory = Join-Path $env:ProgramFiles 'Git/cmd'
          if (-not (Test-Path -LiteralPath (Join-Path $gitDirectory 'git.exe') -PathType Leaf)) {
            throw 'Trusted runner Git executable is missing'
          }
          $env:Path = @(
            $gitDirectory
            $PSHOME
            (Join-Path $env:SystemRoot 'System32')
            $env:SystemRoot
          ) -join ';'
          & (Join-Path $PSHOME 'pwsh.exe') -NoProfile -File scripts/database/tests/Run-Tests.ps1
          exit $LASTEXITCODE
      - name: Clean only owned recovery peer fixture
        if: always() && steps.scope.outputs.tooling != 'false'
        run: |
          $peer = Join-Path $env:RUNNER_TEMP 'recovery-tooling-peer'
          if (Test-Path $peer) {
            git worktree remove $peer
            if ($LASTEXITCODE -ne 0) { throw 'Recovery peer cleanup failed' }
          }
