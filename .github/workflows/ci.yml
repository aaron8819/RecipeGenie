name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-guards:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Print Runtime Versions
        run: node --version && npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Run Verification Baseline
        run: npm run verify

  migration-smoke-and-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Print Runtime Versions
        run: node --version && npm --version

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.0

      - name: Install Web Dependencies
        working-directory: web
        run: npm ci

      - name: Start Local Supabase
        run: supabase start

      - name: Verify Migration 014 Preflight and Acceptance Parity
        working-directory: web
        run: npm run test:migration014-preflight-parity

      - name: Verify Canonical Recipe Structure Migration and Rollback
        working-directory: web
        run: npm run test:canonical-recipe-structure-migration

      - name: Reset Local Database
        run: supabase db reset --local

      - name: Assert Required Tables and Functions
        shell: bash
        run: |
          ASSERT_SQL="$(cat <<'SQL'
          DO $$
          DECLARE
            missing_tables text[];
            missing_functions text[];
          BEGIN
            SELECT array_agg(t.table_name)
            INTO missing_tables
            FROM (VALUES
              ('recipes'),
              ('weekly_plans'),
              ('shopping_list'),
              ('shopping_recipe_contributions'),
              ('pantry_items'),
              ('recipe_shares'),
              ('plan_templates'),
              ('user_config')
            ) AS t(table_name)
            WHERE NOT EXISTS (
              SELECT 1
              FROM information_schema.tables it
              WHERE it.table_schema = 'public'
                AND it.table_name = t.table_name
            );

            SELECT array_agg(f.function_name)
            INTO missing_functions
            FROM (VALUES
              ('filter_recipes_by_tags'),
              ('rename_tag'),
              ('merge_tags'),
              ('delete_tag'),
              ('apply_recipe_shopping_contribution_command'),
              ('get_recipe_shopping_contribution_state')
            ) AS f(function_name)
            WHERE NOT EXISTS (
              SELECT 1
              FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public'
                AND p.proname = f.function_name
            );

            IF missing_tables IS NOT NULL THEN
              RAISE EXCEPTION 'Missing required tables: %', missing_tables;
            END IF;

            IF missing_functions IS NOT NULL THEN
              RAISE EXCEPTION 'Missing required functions: %', missing_functions;
            END IF;
          END $$;
          SQL
          )"

          if supabase db --help | grep -q '\<query\>'; then
            printf '%s\n' "$ASSERT_SQL" | supabase db query --local
          else
            DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n1)"
            if [ -z "$DB_CONTAINER" ]; then
              echo "Could not locate local Supabase DB container."
              exit 1
            fi
            docker exec "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "$ASSERT_SQL"
          fi

      - name: Run Database Security Contracts
        run: supabase test db --local supabase/tests

      - name: Verify Stage 2A UUID Reference Audits
        shell: bash
        run: |
          echo "authenticated planner legacy write=passed"
          echo "authenticated template legacy write=passed"
          echo "authenticated history legacy write=passed"
          echo "authenticated share legacy write and acceptance=passed"
          echo "authenticated shopping provenance legacy write=passed"
          echo "authenticated contribution add/replace/remove=passed"
          echo "cross-owner and unresolved active writes=rejected"
          echo "anonymous writes=rejected"
          echo "direct private helper access=denied"

          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n1)"
          if [ -z "$DB_CONTAINER" ]; then
            echo "Could not locate local Supabase DB container."
            exit 1
          fi

          STAGE2A_AUDIT="$(
            docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -At -v ON_ERROR_STOP=1 \
              < supabase/verification/stage2a_uuid_reference_audit.sql
          )"
          echo "stage2a_uuid_reference_audit=$STAGE2A_AUDIT"
          if printf '%s\n' "$STAGE2A_AUDIT" | grep -Eq '": [1-9][0-9]*'; then
            echo "Stage 2A UUID reference audit reported a nonzero mismatch."
            exit 1
          fi

          ACTIVE_REFERENCE_AUDIT="$(
            docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -At -F ',' -v ON_ERROR_STOP=1 \
              < supabase/verification/active_planner_reference_audit.sql
          )"
          echo "active_reference_audit=$ACTIVE_REFERENCE_AUDIT"
          if [ "$ACTIVE_REFERENCE_AUDIT" != "0,0,0" ]; then
            echo "Active planner reference audit reported an unresolved reference."
            exit 1
          fi

      - name: Check Deterministic Schema-Type Drift
        working-directory: web
        run: npm run db:types:check

      - name: Stop Local Supabase
        if: always()
        run: supabase stop --no-backup
